name: Make AtbinYar website icon background transparent

on:
  push:
    branches: [main]
    paths:
      - "logo.png"
      - "scripts/process-brand-assets.py"
      - ".github/workflows/transparent-icons.yml"

permissions:
  contents: write

jobs:
  transparent-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process website logo
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/process-brand-assets.py
      - name: Commit transparent logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png
          if git diff --cached --quiet; then
            echo "Logo already has a transparent outer background."
          else
            git commit -m "fix: remove white outer background from website logo"
            git push origin HEAD:main
          fi
