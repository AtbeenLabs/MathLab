name: Make AtbinYar website icon background transparent

on:
  push:
    branches: [main]
    paths:
      - "logo.png"
      - ".github/workflows/transparent-icons.yml"

permissions:
  contents: write

jobs:
  transparent-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove connected white background from logo
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from collections import deque
          from PIL import Image

          path = "logo.png"
          image = Image.open(path).convert("RGBA")
          pixels = image.load()
          width, height = image.size
          total = width * height
          candidates = bytearray(total)

          for y in range(height):
              for x in range(width):
                  red, green, blue, alpha = pixels[x, y]
                  if alpha and min(red, green, blue) >= 220 and max(red, green, blue) - min(red, green, blue) <= 55:
                      candidates[y * width + x] = 1

          background = bytearray(total)
          queue = deque()
          def add_if_background(x, y):
              index = y * width + x
              if candidates[index] and not background[index]:
                  background[index] = 1
                  queue.append(index)

          for x in range(width):
              add_if_background(x, 0)
              add_if_background(x, height - 1)
          for y in range(height):
              add_if_background(0, y)
              add_if_background(width - 1, y)

          while queue:
              index = queue.popleft()
              x, y = index % width, index // width
              for dy in (-1, 0, 1):
                  for dx in (-1, 0, 1):
                      if dx or dy:
                          nx, ny = x + dx, y + dy
                          if 0 <= nx < width and 0 <= ny < height:
                              add_if_background(nx, ny)

          removed = sum(background)
          if removed < 20:
              raise RuntimeError(f"Expected white outer background, found only {removed} pixels")

          output = image.copy()
          out = output.load()
          for index, is_background in enumerate(background):
              if not is_background:
                  continue
              x, y = index % width, index // width
              red, green, blue, old_alpha = pixels[x, y]
              neighbours = []
              for dy in (-1, 0, 1):
                  for dx in (-1, 0, 1):
                      if dx or dy:
                          nx, ny = x + dx, y + dy
                          if 0 <= nx < width and 0 <= ny < height and not background[ny * width + nx]:
                              candidate = pixels[nx, ny]
                              if candidate[3]:
                                  neighbours.append(candidate)
              if not neighbours:
                  out[x, y] = (red, green, blue, 0)
                  continue
              foreground = max(neighbours, key=lambda p: 255 - min(p[0], p[1], p[2]))
              ratios = []
              for observed, colour in zip((red, green, blue), foreground[:3]):
                  denominator = 255 - colour
                  if denominator >= 12:
                      ratios.append(max(0.0, min(1.0, (255 - observed) / denominator)))
              coverage = sorted(ratios)[len(ratios) // 2] if ratios else 0.0
              alpha = round(255 * coverage * foreground[3] / 255)
              out[x, y] = (*foreground[:3], alpha)

          output.save(path, format="PNG", optimize=True)
          print(f"Removed {removed} connected outer-background pixels from {path}")
          PY
      - name: Commit transparent logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logo.png
          if git diff --cached --quiet; then
            echo "Logo already has a transparent outer background."
          else
            git commit -m "fix: remove white outer background from website icon"
            git push origin HEAD:main
          fi
